[project]
name = "chargewindow-homeassistant"
version = "0.4.0"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.338",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
